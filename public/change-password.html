<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数独小游戏 - 修改密码</title><link rel="stylesheet" href="/auth.css"></head><body>
<main class="auth-card">
  <div class="brand"><div class="logo">钥</div><div><h1>首次登录修改密码</h1><p>完成后才可进入数独应用</p></div></div>
  <form id="pwForm">
    <div class="field"><label>当前密码</label><input id="oldp" type="password" autocomplete="current-password" required autofocus></div>
    <div class="field"><label>新密码（至少8位）</label><input id="newp" type="password" autocomplete="new-password" minlength="8" required></div>
    <div class="field"><label>再次输入新密码</label><input id="newp2" type="password" autocomplete="new-password" minlength="8" required></div>
    <button id="btn" type="submit">保存新密码并进入</button><div id="msg" class="msg"></div>
  </form>
</main>
<script>
const f=document.getElementById('pwForm'),m=document.getElementById('msg'),b=document.getElementById('btn');
f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='';const old_password=oldp.value,new_password=newp.value;if(new_password!==newp2.value){m.textContent='两次输入的新密码不一致';return}b.disabled=true;b.textContent='正在保存…';try{const r=await fetch('/api/auth/password',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({old_password,new_password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'修改失败');m.classList.add('ok');m.textContent='修改成功，正在进入…';location.replace(d.next||'/app.html');}catch(err){m.classList.remove('ok');m.textContent=err.message}finally{b.disabled=false;b.textContent='保存新密码并进入'}});
</script></body></html>
